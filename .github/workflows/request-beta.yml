name: Request verified SPQR beta after a source update
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  request-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch private release verification
        env:
          RELEASE_TRIGGER_TOKEN: ${{ secrets.SPQR_RELEASE_TRIGGER_TOKEN }}
        run: |
          if [[ -z "$RELEASE_TRIGGER_TOKEN" ]]; then
            echo '::notice::SPQR_RELEASE_TRIGGER_TOKEN is not configured; the private 30-minute release check remains active.'
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 3 \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $RELEASE_TRIGGER_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/stepOnO927/spqr-private-vault/actions/workflows/public-release.yml/dispatches \
            -d '{"ref":"main"}'

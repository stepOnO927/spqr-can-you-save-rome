name: Browser smoke
on:
  pull_request:
    paths-ignore:
      - '**.md'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm install --no-save playwright@1.64.1
      # GitHub's Ubuntu image already contains Chromium's runtime libraries.
      # Avoid apt mirror failures while still letting Chromium itself fail the
      # smoke test if a future image is missing a required library.
      - run: npx playwright install chromium
      - run: |
          node server.mjs > server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          node tools/travel-smoke.mjs
          node scripts/multipolar-sim.mjs > multipolar-simulation.json
          node scripts/market-120-sim.mjs > market-120-simulation.json
          node tools/multipolar-smoke.mjs
          node tools/imperium-smoke.mjs
          node tools/fort-intelligence-smoke.mjs
          node tools/warning-ledger-smoke.mjs
          node tools/chronicle-person-smoke.mjs
          node tools/unknown-person-smoke.mjs
          node scripts/imperium-sim.mjs > imperium-simulation.json
          node tools/onboarding-smoke.mjs
          node tools/systems-smoke.mjs
          node tools/intelligence-partners-smoke.mjs
          node tools/trade-intelligence-smoke.mjs
          node tools/portrait-institutions-smoke.mjs
          node tools/procedural-portrait-smoke.mjs
          node tools/legacy-identity-smoke.mjs
          node tools/safe-save-smoke.mjs
          node tools/health-succession-smoke.mjs
          node tools/newborn-age-smoke.mjs
          node tools/born-portraits-smoke.mjs
          node tools/inheritance-settlement-smoke.mjs
          node tools/satisfaction-map-smoke.mjs
          node tools/campaign-date-smoke.mjs
          node tools/scenario-general-portrait-smoke.mjs
          node tools/civic-portrait-smoke.mjs
          node tools/dossier-rumor-smoke.mjs
          node tools/captive-release-smoke.mjs
          node tools/inquiry-price-smoke.mjs
          node tools/mission-discount-smoke.mjs
          node tools/merge-map-switch-smoke.mjs
          node tools/scenario-systems-smoke.mjs
          node tools/construction-smoke.mjs
          node tools/market-smoke.mjs
          node tools/browser-smoke.mjs
          node tools/han-smoke.mjs
          node tools/han-market-smoke.mjs
          node tools/han-court-smoke.mjs
          node tools/han-ruler-smoke.mjs
          node tools/han-defeat-smoke.mjs
          node tools/han-field-smoke.mjs
          node tools/phase-v-smoke.mjs
          node tools/capture-check.mjs
          node tools/map-benchmark.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-evidence
          path: |
            browser-smoke-1920x1080.png
            capture-control-1920x1080.png
            map-benchmark-1920x1080.png
            map-benchmark.json
            multipolar-simulation.json
            market-120-simulation.json
            server.log


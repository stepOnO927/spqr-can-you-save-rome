name: Browser smoke
on:
  pull_request:
    paths-ignore:
      - '**.md'
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        if: matrix.part == 1
      - run: npm install --no-save playwright@1.64.1
      # GitHub's Ubuntu image already contains Chromium's runtime libraries.
      # Avoid apt mirror failures while still letting Chromium itself fail the
      # smoke test if a future image is missing a required library.
      - run: npx playwright install chromium
      - run: |
          node server.mjs > server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          node() { echo "BROWSER_CHECK: $*" >&2; command timeout 240s node "$@"; }
          case "${{ matrix.part }}" in
            1)
              node tools/poki-mobile-smoke.mjs
              node tools/short-screen-smoke.mjs
              node tools/runtime-storage-failure-smoke.mjs
              node tools/storage-fallback-smoke.mjs
              node tools/inspector-smoke.mjs
              node tools/hundred-days-smoke.mjs
              node tools/roman-hundred-days-smoke.mjs
              node tools/save-transfer-controls-smoke.mjs
              node tools/storage-denied-smoke.mjs
              node tools/travel-smoke.mjs
              node tools/cursus-smoke.mjs
              node tools/cursus-deep-smoke.mjs
              node tools/foreign-contact-courier-smoke.mjs
              node tools/coalition-courier-smoke.mjs
              node tools/diplomatic-chronicle-smoke.mjs
              node tools/ai-wartime-aid-smoke.mjs
              node tools/frontier-response-smoke.mjs
              node tools/player-aid-letter-smoke.mjs
              node tools/player-request-aid-smoke.mjs
              node tools/official-name-snapshots-smoke.mjs
              node tools/procedural-portrait-smoke.mjs
              ;;
            2)
              node tools/cursus-applicant-smoke.mjs
              node tools/han-court-smoke.mjs
              node scripts/multipolar-sim.mjs > multipolar-simulation.json
              node scripts/market-120-sim.mjs > market-120-simulation.json
              node tools/multipolar-smoke.mjs
              node tools/player-strategic-offer-smoke.mjs
              node tools/peace-mail-courier-smoke.mjs
              node tools/imperium-smoke.mjs
              node tools/fort-intelligence-smoke.mjs
              node tools/warning-ledger-smoke.mjs
              node tools/chronicle-person-smoke.mjs
              node tools/unknown-person-smoke.mjs
              node tools/separate-kingdom-succession-smoke.mjs
              node tools/regional-court-vacancy-smoke.mjs
              node tools/court-portrait-smoke.mjs
              node tools/senator-portraits-smoke.mjs
              node tools/senate-record-privacy-smoke.mjs
              node tools/roman-market-sales-smoke.mjs
              node tools/roman-supply-contract-smoke.mjs
              node tools/roman-economy-forecast-smoke.mjs
              node tools/market-smoke.mjs
              node tools/han-smoke.mjs
              node tools/han-market-smoke.mjs
              node tools/han-supply-contract-smoke.mjs
              node tools/han-ruler-smoke.mjs
              node tools/han-defeat-smoke.mjs
              node tools/han-field-smoke.mjs
              node tools/mailbox-smoke.mjs
              node tools/mail-privacy-smoke.mjs
              node tools/gathering-presence-smoke.mjs
              node tools/gathering-delegate-smoke.mjs
              node tools/atlas-mail-alert-smoke.mjs
              ;;
            3)
              node scripts/imperium-sim.mjs > imperium-simulation.json
              node tools/onboarding-smoke.mjs
              node tools/systems-smoke.mjs
              node tools/intelligence-partners-smoke.mjs
              node tools/trade-intelligence-smoke.mjs
              node tools/portrait-institutions-smoke.mjs
              node tools/legacy-identity-smoke.mjs
              node tools/safe-save-smoke.mjs
              node tools/health-succession-smoke.mjs
              node tools/succession-ui-recovery-smoke.mjs
              node tools/newborn-age-smoke.mjs
              node tools/born-portraits-smoke.mjs
              node tools/inheritance-settlement-smoke.mjs
              node tools/satisfaction-map-smoke.mjs
              node tools/campaign-date-smoke.mjs
              node tools/scenario-general-portrait-smoke.mjs
              node tools/civic-portrait-smoke.mjs
              node tools/dossier-rumor-smoke.mjs
              node tools/captive-release-smoke.mjs
              node tools/inquiry-price-smoke.mjs
              node tools/mission-discount-smoke.mjs
              node tools/merge-map-switch-smoke.mjs
              node tools/scenario-systems-smoke.mjs
              node tools/faction-save-transfer-smoke.mjs
              node tools/construction-smoke.mjs
              command timeout 900s node tools/browser-smoke.mjs
              node tools/phase-v-smoke.mjs
              node tools/roman-defeat-smoke.mjs
              node tools/capture-check.mjs
              node tools/map-benchmark.mjs
              ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-evidence-${{ matrix.part }}
          path: |
            browser-smoke-1920x1080.png
            capture-control-1920x1080.png
            map-benchmark-1920x1080.png
            map-benchmark.json
            multipolar-simulation.json
            market-120-simulation.json
            server.log


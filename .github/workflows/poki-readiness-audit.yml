name: Poki readiness audit
on:
  push:
    branches:
      - audit/poki-readiness-20261114
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.64.1
      - run: npx playwright install chromium
      - run: |
          node server.mjs > server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          node tools/poki-readiness-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poki-readiness-evidence
          path: |
            poki-audit.json
            poki-audit-*.png
            server.log
